<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>WGL Soluções Tecnológicas</title>
  <link rel="stylesheet" href="style.css">

  <style>
     body {
  margin: 0;
  font-family: Arial;
  background: black;
}

/* Tela cheia */
#splash {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: linear-gradient(45deg, #0b2341, #02101f);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Fundo animado */
.overlay {
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(0,255,200,0.2), transparent);
  animation: moveBg 6s linear infinite;
}

/* Logo */
.logo {
  width: 200px;
  z-index: 2;
  animation: pulse 2s infinite ease-in-out;
}

/* Texto */
.titulo {
  color: white;
  margin-top: 20px;
  z-index: 2;
  letter-spacing: 2px;
  animation: fadeIn 2s ease;
}

/* Animações */
@keyframes pulse {
  0% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.1); filter: brightness(1.5); }
  100% { transform: scale(1); filter: brightness(1); }
}

@keyframes moveBg {
  0% { transform: translate(-25%, -25%) rotate(0deg); }
  100% { transform: translate(-25%, -25%) rotate(360deg); }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px);}
  to { opacity: 1; transform: translateY(0);}
}


/* Botão estilo hacker */
#enterBtn {
  margin-top: 30px;
  padding: 15px 40px;
  background: transparent;
  border: 2px solid #00ff9f;
  color: #00ff9f;
  font-size: 16px;
  letter-spacing: 2px;
  cursor: pointer;
  position: relative;
  transition: 0.3s;
  text-transform: uppercase;
}

/* Glow */
#enterBtn:hover {
  background: #00ff9f;
  color: black;
  box-shadow: 0 0 20px #00ff9f, 0 0 40px #00ff9f;
}

/* Efeito scanner */
#enterBtn::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(120deg, transparent, #00ff9f, transparent);
  transition: 0.5s;
}

#enterBtn:hover::before {
  left: 100%;
}


  </style>
</head>

<body>
   <a href="index1.html">
  <button id="enterBtn">ACESSAR PÁGINA</button>
</a>

<div id="splash">
  <div class="overlay"></div>
  <img src="logo.png" class="logo">
  <h1 class="titulo">WGL SOLUÇÕES TECNOLÓGICAS</h1>
</div>

<div id="conteudo">
  <h2>Seu site aqui</h2>
</div>

 <canvas id="matrix"></canvas>

 <script src="script.js">
    
 </script>    
    



</body>
</html>
